<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slide Deck - Tests - v0.1.0</title>
    
    <!-- ═══════════════════════════════════════════════════════════════════════
         Slide Deck Test Suite - v0.1.0
         Using QUnit for browser-based testing
         ═══════════════════════════════════════════════════════════════════════ -->
    
    <!-- QUnit CSS -->
    <link rel="stylesheet" href="https://code.jquery.com/qunit/qunit-2.20.0.css">
    
    <style>
        /* Test runner customization */
        #qunit {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        
        #qunit-fixture {
            position: absolute;
            top: -10000px;
            left: -10000px;
            width: 1024px;
            height: 768px;
        }
        
        .test-info {
            padding: 10px 20px;
            background: #f5f5f7;
            border-bottom: 1px solid #ddd;
            font-size: 14px;
            color: #666;
        }
        
        .test-info code {
            background: #e8e8e8;
            padding: 2px 6px;
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <div class="test-info">
        Testing <code>v0.1.0</code> — Core MVP components
    </div>
    
    <!-- QUnit containers -->
    <div id="qunit"></div>
    <div id="qunit-fixture"></div>
    
    <!-- QUnit JS -->
    <script src="https://code.jquery.com/qunit/qunit-2.20.0.js"></script>
    
    <!-- Test Infrastructure -->
    <script src="test-paths.js"></script>
    <script src="test-utils.js"></script>
    
    <!-- Component Tests (co-located, loaded here for convenience) -->
    <script src="../components/slide-page/slide-page.test.js"></script>
    <script src="../components/slide-deck/slide-deck.test.js"></script>
    
    <script>
        // Configure QUnit
        QUnit.config.testTimeout = 10000;
        
        // Log results
        QUnit.done(function(details) {
            console.log('Tests completed:', details.total, 'total,', 
                        details.passed, 'passed,', 
                        details.failed, 'failed');
        });
    </script>
</body>
</html>
